<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Most used · AI Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141820'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2340ba4f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2373b3fa'/%3E%3C/svg%3E">
<!-- The quick button's pop-up (web/quick.js shows it in a frame on our pages; see quick.py). Opened on its own
     (https://<hub>/quick) it works as a plain page too, e.g. as a phone bookmark. -->
<style>
/* Same colours as the hub page (web/index.html) */
:root {
  --bg: #151820; --row: #1b1f28; --row-h: #232836; --line: #262b34;
  --text: #e6edf2; --muted: #8c949e; --faint: #5d646e;
  --green: #40ba4f; --amber: #db9e26; --red: #f7524a; --link: #73b3fa;
  --start: #21578c; --start-h: #2a6aa8;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #ffffff; --row: #f1f4f8; --row-h: #e8edf4; --line: #e6e9ee;
    --text: #1a1f26; --muted: #5f6873; --faint: #8a929c;
    --green: #2e9b3c; --amber: #b07a12; --red: #d93a32; --link: #2468b0;
    --start: #2468b0; --start-h: #1f5b9b; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #ffffff; --row: #f1f4f8; --row-h: #e8edf4; --line: #e6e9ee;
  --text: #1a1f26; --muted: #5f6873; --faint: #8a929c;
  --green: #2e9b3c; --amber: #b07a12; --red: #d93a32; --link: #2468b0;
  --start: #2468b0; --start-h: #1f5b9b; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body.alone { max-width: 460px; margin: 0 auto; padding: 8px 0 24px; }
header { display: flex; align-items: center; gap: 6px; padding: 8px 8px 4px 14px; }
h1 { flex: 1; margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.hub { color: var(--link); text-decoration: none; font-size: 13px; padding: 6px 8px; border-radius: 8px; white-space: nowrap; }
.hub:hover, .hub:focus-visible { background: var(--row-h); outline: none; }
.x { width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font: 18px/1 system-ui, sans-serif;
  cursor: pointer; display: grid; place-items: center; }
.x:hover, .x:focus-visible { background: var(--row-h); color: var(--text); outline: none; }
body.alone .x { display: none; }
ol { list-style: none; margin: 0; padding: 2px 6px 6px; }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; min-height: 46px;
  padding: 5px 8px; border: 0; border-radius: 10px; background: transparent; color: inherit; font: inherit; text-align: left;
  text-decoration: none; cursor: pointer; }
.row:hover, .row:focus-visible { background: var(--row-h); outline: none; }
.row:focus-visible { box-shadow: inset 0 0 0 2px var(--link); }
.row[aria-disabled="true"] { cursor: default; }
.row[aria-disabled="true"] .nm, .row[aria-disabled="true"] .ic { opacity: .5; }
.ic { width: 34px; height: 34px; border-radius: 9px; background: var(--row); display: grid; place-items: center; font-size: 18px; overflow: hidden; }
.ic img { width: 24px; height: 24px; object-fit: contain; }
.tx { min-width: 0; display: flex; flex-direction: column; }
.nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.here .sub { color: var(--link); }
.end { display: flex; align-items: center; gap: 7px; color: var(--faint); font-size: 11px; white-space: nowrap; }
.st { color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on { background: var(--green); } .dot.busy { background: var(--amber); } .dot.failed { background: var(--red); }
kbd { font: 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--faint); border: 1px solid var(--line); border-radius: 4px;
  padding: 2px 4px; min-width: 16px; text-align: center; }
@media (hover: none) { kbd { display: none; } }
footer { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 8px 12px 10px; border-top: 1px solid var(--line);
  font-size: 12px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; padding: 4px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--start); color: #fff; }
.seg button:focus-visible { outline: 2px solid var(--link); outline-offset: -2px; }
.sp { flex: 1; }
.lnk { border: 0; background: transparent; color: var(--link); font: inherit; padding: 4px 2px; cursor: pointer; }
.msg { margin: 8px 14px 14px; color: var(--muted); }
.msg a { color: var(--link); }
form.login { padding: 4px 14px 14px; }
form.login label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
form.login input { width: 100%; font: inherit; color: var(--text); background: var(--row); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
form.login input:focus { outline: 2px solid var(--start-h); outline-offset: 1px; }
form.login button { margin-top: 10px; width: 100%; font: inherit; font-weight: 700; color: #fff; background: var(--start); border: 0;
  border-radius: 999px; padding: 9px 14px; cursor: pointer; }
form.login button:hover { background: var(--start-h); }
form.login button:disabled { opacity: .6; }
.err { color: var(--red); font-size: 13px; min-height: 18px; margin: 8px 0 0; }
.hint { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.toast { margin: 0 12px 8px; padding: 8px 10px; border-radius: 8px; background: var(--row); font-size: 13px; }
.toast.bad { color: var(--red); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1 id="h">Most used</h1>
  <a class="hub" id="hub" href="./" target="_blank" rel="noopener" title="Open the AI Hub Home page">⌂ AI Hub</a>
  <button class="x" id="x" type="button" aria-label="Close" title="Close (Esc)">✕</button>
</header>
<main id="m"><p class="msg">Loading…</p></main>
<div id="toast" class="toast" role="status" hidden></div>
<footer id="ft" hidden>
  <span id="opens-l">Opens in</span>
  <span class="seg" role="group" aria-labelledby="opens-l">
    <button type="button" data-t="new">New tab</button><button type="button" data-t="same">This tab</button></span>
  <span class="sp"></span>
  <button type="button" class="lnk" id="back" hidden title="Put the round button back where it started">↘ Button back</button>
</footer>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const framed = window.parent !== window;
if (!framed) document.body.classList.add("alone");

/* The hub page's settings (same address, so the same browser storage): theme, and the remembered place
   each tile opens (opts.pjChoice). Ours: where links open. */
let opts = {}, qo = {};
try { opts = JSON.parse(localStorage.getItem("aihub-opts") || "{}"); } catch (e) {}
try { qo = JSON.parse(localStorage.getItem("aihub-quick") || "{}"); } catch (e) {}
if (opts.theme === "dark" || opts.theme === "light") document.documentElement.dataset.theme = opts.theme;
const saveQo = () => { try { localStorage.setItem("aihub-quick", JSON.stringify(qo)); } catch (e) {} };
const from = new URLSearchParams(location.hash.slice(1)).get("from") || "";
let port = null, data = null, state = null, moved = false, busy = false, toastTimer = 0;

/* ---- the button's script (quick.js) hands us a private channel; nothing goes through the page ---- */
function send(type, extra) { if (port) port.postMessage({ aihubQuick: type, ...(extra || {}) }); }
addEventListener("message", e => {
  if (e.source !== window.parent || !e.data || e.data.aihubQuick !== "port" || !e.ports || !e.ports[0]) return;
  port = e.ports[0];
  moved = !!e.data.moved;
  port.onmessage = ev => {
    const d = ev.data || {};
    if (d.aihubQuick === "refresh") { moved = !!d.moved; load(); focusFirst(); }
    else if (d.aihubQuick === "moved") { moved = !!d.moved; $("#back").hidden = !moved; }
  };
  send("ready");
  lastH = 0;
  size();
  $("#back").hidden = !moved;
});
let lastH = 0;
function size() {
  if (!port) return;   // sent once the channel is there (it asks for the size then)
  const h = Math.ceil(document.body.getBoundingClientRect().height);
  if (h && h !== lastH) { lastH = h; send("size", { h }); }
}
if (window.ResizeObserver) new ResizeObserver(size).observe(document.body);

const target = () => qo.target === "same" ? (framed ? "_top" : "_self") : "_blank";
function paintTarget() {
  for (const b of document.querySelectorAll(".seg button")) b.setAttribute("aria-pressed", String((qo.target === "same") === (b.dataset.t === "same")));
  for (const a of document.querySelectorAll("a[data-i], #hub")) a.target = target();
}

/* ---- where a tile opens: the Home page's choice (web page, a PC's served folder, a program on a PC's screen) ---- */
const machine = pc => (state?.machines || []).find(m => m.name === pc);
function pcOff(m, pc) {
  if (!state) return "";            // not known yet: try it
  if (!m) return `${pc} isn't one of this hub's PCs`;
  if (!m.online) return `${pc} is off or not answering`;
  return "";
}
function options(p) {
  const out = [];
  for (const pl of p.places || []) {
    if (pl.kind === "web" && pl.url) {
      out.push({ key: "web:" + pl.url, label: pl.label, href: pl.url, detail: pl.url.replace(/^https?:\/\//, "").replace(/\/$/, "") });
    } else if (pl.kind === "files") {
      const m = machine(pl.pc), info = m?.projects || {};
      const shared = info.files_url && (info.serve || []).includes(pl.serve);
      const off = pcOff(m, pl.pc) || (state && !shared ? `${pl.pc}'s hub isn't sharing this folder` : "");
      out.push({ key: `files:${pl.pc}:${pl.serve}/${pl.open || ""}`, label: pl.label, off, needsState: !state,
        href: shared ? `${info.files_url}/${encodeURIComponent(pl.serve)}/${pl.open || ""}` : null, detail: `On the ${pl.pc}` });
    } else if (pl.kind === "run") {
      const m = machine(pl.pc);
      const off = pcOff(m, pl.pc) || (state && !m.projects?.launchers?.[pl.run] ? `${pl.pc}'s hub doesn't have this program set up` : "");
      out.push({ key: `run:${pl.pc}:${pl.run}`, label: pl.label, off, launch: { machine: pl.pc, run: pl.run }, detail: `Opens on the ${pl.pc}'s screen` });
    }
  }
  return out;
}
function primary(p) {
  const all = options(p), key = (opts.pjChoice || {})[p.id];
  return all.find(o => o.key === key) || all.find(o => !o.off) || all[0] || null;
}
/* The tile's dot: its container on a PC, the hub's last check of its address, or a program open on a PC. */
function status(p) {
  const st = data?.status?.[p.id];
  if (p.container?.pc && p.container?.key && state) {
    const m = machine(p.container.pc);
    if (!m || !m.online) return { cls: "", text: "PC off" };
    const r = (m.rows || []).find(x => x.key === p.container.key);
    if (r && r.state === "off") return { cls: "", text: "Off" };
    if (r) return { cls: r.state === "busy" ? "busy" : "on", text: r.state === "busy" ? "Busy" : "" };
  }
  if (st && !st.up && st.answered) return { cls: "", text: p.other_text || "Not loaded" };
  if (st && !st.up && p.on_demand) return { cls: "", text: "Off" };
  if (st) return st.up ? { cls: "on", text: "" } : { cls: "failed", text: "Not answering" };
  for (const x of p.places || [])
    if (x.kind === "run" && (machine(x.pc)?.projects?.running || []).includes(x.run)) return { cls: "on", text: "Running" };
  return null;
}
const icon = p => p.logo ? `<img src="icons/${encodeURIComponent(p.logo)}" alt="">` : esc(p.icon || "•");

function render() {
  $("#h").textContent = data.used ? "Most used" : "Your programs";
  const items = data.items || [];
  if (!items.length) { msg("Nothing on the Home page yet. Add programs there and they show up here."); return; }
  $("#m").innerHTML = `<ol>${items.map((p, i) => {
    const o = primary(p), s = status(p), here = data.here === p.id;
    const sub = here ? "You're here" : o?.off ? o.off : o?.launch ? "▶ " + o.detail : p.about || p.group || o?.detail || "";
    const tip = o ? `${o.label}${o.detail ? " · " + o.detail : ""}` : "";
    const end = `<span class="end">${s?.text ? `<span class="st">${esc(s.text)}</span>` : ""}${s ? `<span class="dot ${s.cls}"></span>` : ""}${i < 10 ? `<kbd>${(i + 1) % 10}</kbd>` : ""}</span>`;
    const inner = `<span class="ic" aria-hidden="true">${icon(p)}</span><span class="tx"><span class="nm">${esc(p.name)}</span><span class="sub">${esc(sub)}</span></span>${end}`;
    const cls = `row${here ? " here" : ""}`, dis = !o || o.off ? ` aria-disabled="true"` : "";
    return o?.href && !o.off
      ? `<li><a class="${cls}" data-i="${i}" href="${esc(o.href)}" target="${target()}" rel="noopener" title="${esc(tip)}">${inner}</a></li>`
      : `<li><button type="button" class="${cls}" data-i="${i}"${dis} title="${esc(tip)}">${inner}</button></li>`;
  }).join("")}</ol>`;
  $("#ft").hidden = false;
  $("#back").hidden = !moved;
  paintTarget();
  size();
}
function msg(html) { $("#m").innerHTML = `<p class="msg">${html}</p>`; $("#ft").hidden = true; size(); }
function toast(text, bad) {
  const t = $("#toast");
  t.textContent = text; t.classList.toggle("bad", !!bad); t.hidden = false; size();
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; size(); }, 4000);
}
function focusFirst() { setTimeout(() => (document.querySelector(".row:not([aria-disabled])") || document.querySelector("#pw"))?.focus(), 0); }

async function load() {
  if (busy) return;
  busy = true;
  try {
    const r = await fetch("api/quick?from=" + encodeURIComponent(from), { cache: "no-store", credentials: "same-origin" });
    if (r.status === 401) { showLogin(); return; }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || `The hub answered ${r.status}`);
    data = j;
    render();
    // the PCs' state says which served folders and programs are there; the list doesn't wait for it
    fetch("api/state", { cache: "no-store", credentials: "same-origin" }).then(x => x.ok ? x.json() : null)
      .then(j2 => { if (j2) { state = j2; render(); } }).catch(() => {});
  } catch (err) {
    msg(`Can't get the list: ${esc(err.message)}. <a href="./" target="_blank" rel="noopener">Open AI Hub</a>`);
  } finally { busy = false; }
}

/* ---- not logged in on this address: the password box, here ---- */
function showLogin(again) {
  $("#h").textContent = "Log in";
  $("#ft").hidden = true;
  if (again) {   // the hub took the password, but the frame still isn't logged in: the browser won't share it here
    msg(`You're logged in, but this browser won't share the AI Hub login with this page's address.
      <a href="./" target="_blank" rel="noopener">Open AI Hub</a> instead, or open this page by its …testtagrepair.co.nz name.`);
    return;
  }
  $("#m").innerHTML = `<form class="login" id="lf">
    <label for="pw">AI Hub password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit" id="go">Log in</button>
    <p class="err" id="err" role="alert"></p>
    <p class="hint">Once on each browser and address; it lasts 30 days.</p></form>`;
  size();
  $("#lf").addEventListener("submit", async e => {
    e.preventDefault();
    const b = $("#go");
    b.disabled = true; $("#err").textContent = "";
    try {
      const r = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
        body: JSON.stringify({ password: $("#pw").value }) });
      const j = await r.json().catch(() => ({}));
      if (r.ok && j.ok) {
        const c = await fetch("api/quick?from=" + encodeURIComponent(from), { cache: "no-store", credentials: "same-origin" });
        if (c.status === 401) { showLogin(true); return; }
        load(); focusFirst();
        return;
      }
      $("#err").textContent = j.error || `The hub answered ${r.status}`;
      $("#pw").select();
    } catch (err) {
      $("#err").textContent = "Can't reach the hub: " + err.message;
    }
    b.disabled = false;
  });
  if (framed) setTimeout(() => $("#pw")?.focus(), 0);
}

/* ---- opening one ---- */
function used(id) {   // counted on the hub; a beacon still goes when this tab is the one being replaced
  const body = new Blob([JSON.stringify({ id })], { type: "text/plain" });
  if (!(navigator.sendBeacon && navigator.sendBeacon("api/quick/use", body)))
    fetch("api/quick/use", { method: "POST", body, credentials: "same-origin", keepalive: true }).catch(() => {});
}
async function go(el, ev) {   // ev = the click (keys click the row too)
  const p = data?.items?.[+el.dataset.i];
  if (!p) return;
  const o = primary(p);
  if (!o || o.off) { ev.preventDefault(); toast(o?.off || "Nothing to open: see it on the AI Hub Home page", true); return; }
  used(p.id);
  if (o.href) {   // a real link: the browser opens it (new tab, or this one)
    setTimeout(() => send("close"), 50);
    return;
  }
  ev.preventDefault();
  if (o.needsState) { toast("Still checking the PCs, try again in a moment"); return; }
  el.disabled = true;
  try {
    const r = await fetch("api/launch", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
      body: JSON.stringify(o.launch) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || j.ok === false) throw new Error(j.error || r.statusText);
    toast(j.message || "Started");
    setTimeout(() => send("close"), 1500);
  } catch (err) { toast(err.message, true); }
  finally { el.disabled = false; }
}
$("#m").addEventListener("click", e => {
  const el = e.target.closest("[data-i]");
  if (el) go(el, e);
});
document.addEventListener("keydown", e => {
  if (e.target.closest?.("input, textarea")) { if (e.key === "Escape") send("close"); return; }
  if (e.key === "Escape") { send("close"); return; }
  if (/^[0-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) {
    const el = document.querySelector(`[data-i="${(+e.key + 9) % 10}"]`);
    if (el) { e.preventDefault(); el.click(); }   // the same as clicking it (a link opens as links do)
    return;
  }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const rows = [...document.querySelectorAll(".row")], i = rows.indexOf(document.activeElement);
    const n = e.key === "ArrowDown" ? Math.min(rows.length - 1, i + 1) : Math.max(0, i - 1);
    if (rows[n]) { e.preventDefault(); rows[n].focus(); }
  }
});
$("#x").addEventListener("click", () => send("close"));
$("#back").addEventListener("click", () => send("reset"));
for (const b of document.querySelectorAll(".seg button"))
  b.addEventListener("click", () => { qo.target = b.dataset.t; saveQo(); paintTarget(); });
$("#hub").addEventListener("click", () => setTimeout(() => send("close"), 50));
paintTarget();
load().then(() => { if (framed) focusFirst(); });
</script>
</body>
</html>
