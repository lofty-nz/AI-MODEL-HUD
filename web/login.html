<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23141820'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2340ba4f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%2373b3fa'/%3E%3C/svg%3E">
<style>
/* Same colours as the hub page (web/index.html) */
:root {
  --bg: #0f1116; --panel: #151820; --panel-2: #1b1f28; --line: #262b34;
  --text: #e6edf2; --muted: #8c949e; --green: #40ba4f; --red: #f7524a;
  --start: #21578c; --start-h: #2a6aa8;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5f8; --panel: #ffffff; --panel-2: #f6f8fb; --line: #e6e9ee;
    --text: #1a1f26; --muted: #5f6873; --green: #2e9b3c; --red: #d93a32;
    --start: #2468b0; --start-h: #1f5b9b; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f5f8; --panel: #ffffff; --panel-2: #f6f8fb; --line: #e6e9ee;
  --text: #1a1f26; --muted: #5f6873; --green: #2e9b3c; --red: #d93a32;
  --start: #2468b0; --start-h: #1f5b9b; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 100vh;
  display: grid; place-items: center; padding: 24px 16px; }
.box { width: 100%; max-width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
h1 { font-size: 20px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
h1 svg { flex: none; }
.pc { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
input { width: 100%; font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; }
input:focus { outline: 2px solid var(--start-h); outline-offset: 1px; }
button { margin-top: 14px; width: 100%; font: inherit; font-weight: 700; color: #fff; background: var(--start);
  border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer; }
button:hover { background: var(--start-h); }
button:disabled { opacity: .6; cursor: default; }
.err { color: var(--red); font-size: 13px; min-height: 20px; margin: 10px 0 0; }
.hint { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 2px 5px; overflow-wrap: anywhere; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main class="box">
  <h1><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#141820"/><circle cx="16" cy="16" r="9" fill="none" stroke="#40ba4f" stroke-width="3"/><circle cx="16" cy="16" r="3" fill="#73b3fa"/></svg>AI Hub</h1>
  <p class="pc" id="pc">&nbsp;</p>
  <form id="f" hidden>
    <label for="pw">Hub password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button id="go" type="submit">Log in</button>
    <p class="err" id="err" role="alert"></p>
    <p class="hint">You stay logged in on this browser for 30 days.</p>
  </form>
  <div id="nopw" hidden>
    <p>This hub has no password yet, so it's locked.</p>
    <p class="hint">On the main PC, open a terminal and run:<br><code>python3 ~/Documents/aimon/hub_auth.py set-password</code><br>It sets the password on both PCs. Then reload this page.</p>
  </div>
</main>
<script>
"use strict";
try {   // the theme chosen on the hub's Options tab
  const t = JSON.parse(localStorage.getItem("aihub-opts") || "{}").theme;
  if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
} catch (e) {}
const $ = s => document.querySelector(s);
fetch("api/auth", { cache: "no-store" }).then(r => r.json()).then(j => {
  if (j.logged_in) { location.reload(); return; }     // logged in already (e.g. a link from another site)
  $("#pc").textContent = j.name ? `on ${j.name}` : "";
  $(j.has_password ? "#f" : "#nopw").hidden = false;
  if (j.has_password) $("#pw").focus();
}).catch(() => { $("#f").hidden = false; });
$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const b = $("#go");
  b.disabled = true; $("#err").textContent = "";
  try {
    const r = await fetch("api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: $("#pw").value }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok && j.ok) { location.reload(); return; }   // the hub now sends the page itself
    $("#err").textContent = j.error || `The hub answered ${r.status}`;
    $("#pw").select();
  } catch (err) {
    $("#err").textContent = "Can't reach the hub: " + err.message;
  }
  b.disabled = false;
});
</script>
</body>
</html>
